<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Início · RuralStream</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
</head>
<body class="bg-rural-950 text-rural-100 font-sans antialiased" data-pagina="inicio">

  <main class="md:pl-60 pb-24 md:pb-10">
    <!-- Barra superior -->
    <header class="sticky top-0 z-20 bg-rural-950/90 backdrop-blur border-b border-rural-900">
      <div class="flex items-center gap-4 px-4 md:px-8 h-16">
        <form action="busca.html" class="flex-1 max-w-xl">
          <label class="flex items-center gap-2 h-10 px-4 rounded-full bg-rural-900 border border-rural-800 focus-within:ring-2 focus-within:ring-brand">
            <svg class="w-4 h-4 text-rural-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input name="q" placeholder="Buscar vídeos e pessoas" class="flex-1 bg-transparent text-sm placeholder:text-rural-500 focus:outline-none">
          </label>
        </form>
        <a href="enviar.html" class="hidden sm:inline-flex items-center gap-2 h-10 px-4 rounded-full bg-brand text-brand-contraste text-sm font-semibold hover:bg-brand-hover">+ Enviar vídeo</a>
      </div>
      <!-- Categorias (geradas a partir de CATEGORIAS) -->
      <div id="categorias" class="flex gap-2 px-4 md:px-8 pb-3 overflow-x-auto [scrollbar-width:none]"></div>
    </header>

    <section class="px-4 md:px-8 pt-6">
      <div class="flex items-baseline justify-between">
        <h1 class="font-display text-2xl font-bold">Para você</h1>
        <p id="contador" class="text-sm text-rural-400"></p>
      </div>

      <!-- Grade de vídeos: preenchida pelo JavaScript -->
      <div id="grade" class="mt-5 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-x-4 gap-y-6"></div>

      <p id="vazio" class="hidden py-20 text-center text-rural-400">Nenhum vídeo nesta categoria ainda.</p>

      <div class="mt-10 flex justify-center">
        <button id="carregar-mais" class="h-11 px-6 rounded-full border border-rural-700 text-sm font-medium hover:bg-rural-900">Carregar mais</button>
      </div>
    </section>
  </main>

  <script src="js/dados.js"></script>
  <script src="js/layout.js"></script>
  <script>
    const POR_PAGINA = 12;
    let categoriaAtual = 'todos';
    let exibidos = POR_PAGINA;

    function renderCategorias() {
      const opcoes = { todos: 'Todos', ...CATEGORIAS };
      document.getElementById('categorias').innerHTML = Object.entries(opcoes).map(([chave, rotulo]) => `
        <button data-cat="${chave}" class="shrink-0 h-8 px-3.5 rounded-full text-sm font-medium ${chave === categoriaAtual ? 'bg-white text-rural-950' : 'bg-rural-900 text-rural-300 hover:bg-rural-800'}">${rotulo}</button>
      `).join('');
    }

    function renderGrade() {
      const lista = categoriaAtual === 'todos' ? VIDEOS : VIDEOS.filter((v) => v.categoria === categoriaAtual);
      const visiveis = lista.slice(0, exibidos);
      document.getElementById('grade').innerHTML = visiveis.map((v) => cardVideo(v)).join('');
      document.getElementById('contador').textContent = `${visiveis.length} de ${lista.length} vídeos`;
      document.getElementById('vazio').classList.toggle('hidden', lista.length > 0);
      document.getElementById('carregar-mais').classList.toggle('hidden', exibidos >= lista.length);
    }

    document.getElementById('categorias').addEventListener('click', (e) => {
      const botao = e.target.closest('[data-cat]');
      if (!botao) return;
      categoriaAtual = botao.dataset.cat;
      exibidos = POR_PAGINA;
      renderCategorias();
      renderGrade();
    });

    document.getElementById('carregar-mais').addEventListener('click', () => {
      exibidos += POR_PAGINA;
      renderGrade();
    });

    renderCategorias();
    renderGrade();
  </script>
</body>
</html>
