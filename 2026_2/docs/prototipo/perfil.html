<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil · RuralStream</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
</head>
<body class="bg-rural-950 text-rural-100 font-sans antialiased" data-pagina="perfil">

  <main class="md:pl-60 pb-24 md:pb-10">
    <div class="max-w-6xl mx-auto px-4 md:px-8 pt-10">

      <div id="aviso-enviado" class="hidden mb-6 rounded-xl border border-brand/40 bg-brand/10 px-4 py-3 text-sm text-brand">Vídeo publicado com sucesso.</div>

      <!-- Cabeçalho do perfil -->
      <header class="flex flex-col sm:flex-row sm:items-center gap-6">
        <div id="avatar"></div>
        <div class="flex-1 min-w-0">
          <h1 id="nome" class="font-display text-3xl font-bold"></h1>
          <p id="usuario" class="text-rural-400"></p>
          <p id="bio" class="mt-3 max-w-xl text-sm text-rural-300"></p>
          <dl class="mt-4 flex gap-6 text-sm">
            <div><dt class="sr-only">Vídeos</dt><dd><strong id="total-videos" class="text-white"></strong> <span class="text-rural-400">vídeos</span></dd></div>
            <div><dt class="sr-only">Visualizações</dt><dd><strong id="total-views" class="text-white"></strong> <span class="text-rural-400">visualizações</span></dd></div>
            <div><dt class="sr-only">Curtidas</dt><dd><strong id="total-curtidas" class="text-white"></strong> <span class="text-rural-400">curtidas</span></dd></div>
          </dl>
        </div>
        <div id="acoes" class="flex gap-2"></div>
      </header>

      <!-- Abas -->
      <nav class="mt-10 flex gap-6 border-b border-rural-800" id="abas">
        <button data-aba="videos" class="pb-3 -mb-px border-b-2 text-sm font-medium">Vídeos</button>
        <button data-aba="curtidos" class="pb-3 -mb-px border-b-2 text-sm font-medium">Curtidos</button>
      </nav>

      <div id="grade" class="mt-6 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-x-4 gap-y-6"></div>
      <div id="vazio" class="hidden py-20 text-center">
        <p class="font-display text-xl font-bold" id="vazio-titulo"></p>
        <a href="enviar.html" id="vazio-cta" class="hidden mt-4 inline-flex h-10 px-5 items-center rounded-full bg-brand text-brand-contraste text-sm font-semibold">Enviar primeiro vídeo</a>
      </div>
    </div>
  </main>

  <script src="js/dados.js"></script>
  <script src="js/layout.js"></script>
  <script>
    // perfil.html → meu perfil | perfil.html?id=3 → perfil de outra pessoa
    const usuario = buscarUsuario(parametro('id') || SESSAO.id) || SESSAO;
    const ehMeuPerfil = usuario.id === SESSAO.id;
    const videos = videosDoUsuario(usuario.id);
    let abaAtual = 'videos';

    if (!ehMeuPerfil) document.body.dataset.pagina = '';
    document.title = `${usuario.nome} · RuralStream`;
    document.getElementById('aviso-enviado').classList.toggle('hidden', !parametro('enviado'));
    document.getElementById('avatar').innerHTML = avatar(usuario, 'w-24 h-24 sm:w-28 sm:h-28 text-3xl');
    document.getElementById('nome').textContent = usuario.nome;
    document.getElementById('usuario').textContent = `@${usuario.usuario} · na Rural desde ${formatarData(usuario.criadoEm)}`;
    document.getElementById('bio').textContent = usuario.bio || 'Sem bio.';
    document.getElementById('total-videos').textContent = videos.length;
    document.getElementById('total-views').textContent = formatarNumero(videos.reduce((s, v) => s + v.visualizacoes, 0));
    document.getElementById('total-curtidas').textContent = formatarNumero(videos.reduce((s, v) => s + v.curtidas, 0));

    document.getElementById('acoes').innerHTML = ehMeuPerfil
      ? `<a href="editar-perfil.html" class="h-10 px-5 inline-flex items-center rounded-full bg-rural-800 text-sm font-medium hover:bg-rural-700">Editar perfil</a>`
      : `<button id="seguir" class="h-10 px-5 rounded-full bg-brand text-brand-contraste text-sm font-semibold">Seguir</button>`;

    document.getElementById('seguir')?.addEventListener('click', (e) => {
      const seguindo = e.target.textContent === 'Seguir';
      e.target.textContent = seguindo ? 'Seguindo' : 'Seguir';
      e.target.className = `h-10 px-5 rounded-full text-sm font-semibold ${seguindo ? 'bg-rural-800 text-white' : 'bg-brand text-brand-contraste'}`;
    });

    if (!ehMeuPerfil) document.querySelector('[data-aba="curtidos"]').remove();

    function render() {
      document.querySelectorAll('[data-aba]').forEach((b) => {
        b.className = `pb-3 -mb-px border-b-2 text-sm font-medium ${b.dataset.aba === abaAtual ? 'border-brand text-white' : 'border-transparent text-rural-400 hover:text-white'}`;
      });
      const curtidos = JSON.parse(localStorage.getItem('rs_curtidos') || '[]');
      const lista = abaAtual === 'videos' ? videos : VIDEOS.filter((v) => curtidos.includes(v.id));
      document.getElementById('grade').innerHTML = lista.map((v) => cardVideo(v, { mostrarAutor: abaAtual !== 'videos' })).join('');
      document.getElementById('vazio').classList.toggle('hidden', lista.length > 0);
      document.getElementById('vazio-titulo').textContent = abaAtual === 'videos' ? 'Nenhum vídeo publicado' : 'Nenhum vídeo curtido';
      document.getElementById('vazio-cta').classList.toggle('hidden', !(ehMeuPerfil && abaAtual === 'videos'));
    }

    document.getElementById('abas').addEventListener('click', (e) => {
      if (!e.target.dataset.aba) return;
      abaAtual = e.target.dataset.aba;
      render();
    });

    render();
  </script>
</body>
</html>
